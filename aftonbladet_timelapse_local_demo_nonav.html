Att kunna se hur Aftonbladets startsida såg ut över tid under dygnet.

<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aftonbladet – timme för timme</title>
  <style>
    :root {
      --panel: #1b1b1b;
      --line: #333;
      --text: #f4f4f4;
      --muted: #b7b7b7;
      --yellow: #ffd400;
      --red: #e30613;
      --paper: #f0f0f0;
      --ink: #111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: var(--text);
    }

    header {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: -0.05em;
      line-height: .95;
    }

    p { color: var(--muted); margin: 0 0 14px; }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px 32px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
    }

    .controls { display: grid; gap: 10px; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
      background: var(--yellow);
      color: #111;
    }

    button.secondary {
      background: #2b2b2b;
      color: var(--text);
      border: 1px solid #444;
    }

    button.danger {
      background: #3a1517;
      color: #ffd9d9;
      border: 1px solid #6b282c;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .9rem;
    }

    input, select {
      background: #252525;
      color: var(--text);
      border: 1px solid #444;
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      width: 100%;
    }

    .progress {
      height: 10px;
      background: #252525;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
      border: 1px solid #444;
    }

    .progress > div { height: 100%; width: 0%; background: var(--yellow); }

    .thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      max-height: 220px;
      overflow: auto;
    }

    .thumb {
      width: 48px;
      height: 70px;
      background: #eee;
      border-radius: 7px;
      border: 2px solid #444;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb.active { border-color: var(--yellow); }

    .mini {
      width: 144px;
      height: 210px;
      transform: scale(.333);
      transform-origin: top left;
      background: #eee;
      padding: 4px;
    }

    .mini-top { height: 18px; background: var(--yellow); margin-bottom: 4px; }
    .mini-red { height: 8px; background: var(--red); margin-bottom: 4px; }
    .mini-hero { height: 40px; background: white; border: 1px solid #ccc; margin-bottom: 4px; }
    .mini-block { height: 22px; background: white; border: 1px solid #ccc; margin-bottom: 4px; }

    .stage-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 10px;
    }

    .viewport {
      height: 760px;
      overflow: hidden;
      border-radius: 14px;
      background: #ddd;
      border: 1px solid #444;
      position: relative;
    }

    .zoom-note {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 10;
      background: rgba(0,0,0,.72);
      color: white;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
    }

    .site {
      background: var(--paper);
      color: var(--ink);
      min-height: 4200px;
      width: 185%;
      transform: scale(.54);
      transform-origin: top left;
      transition: opacity .22s linear;
    }

    .ab-top {
      background: #ff3f3a;
      padding: 14px 18px 10px;
      border-bottom: 4px solid #111;
    }

    .brand {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      max-width: 760px;
      width: 72%;
      min-width: 280px;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .timebox { text-align: right; font-weight: 800; font-size: .9rem; }

    .nav {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav span {
      background: #111;
      color: white;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: .82rem;
      font-weight: 800;
    }

    

    .front {
      padding: 16px;
      display: grid;
      grid-template-columns: 1.7fr .8fr;
      gap: 14px;
    }

    .hero, .story, .side, .ad, .live {
      background: white;
      border: 1px solid #ccc;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 0 rgba(0,0,0,.06);
    }

    .hero { padding: 18px; }
    .secondary-hero { margin-top: 12px; }

    .hero-img {
      height: 260px;
      border-radius: 4px;
      background: linear-gradient(135deg, #334155, #cbd5e1);
      margin-bottom: 14px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      font-size: 1.5rem;
    }

    .small-img { height: 190px; }

    .kicker {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 4px 8px;
      font-weight: 900;
      margin-bottom: 8px;
      font-size: .9rem;
    }

    .hero h2 {
      margin: 0;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: clamp(2.9rem, 4.5vw, 5rem);
      line-height: .9;
      letter-spacing: -.05em;
      font-weight: 900;
      
      max-width: 820px;
      word-break: keep-all;
    }

    .story h3, .side h3, .live h3 {
      margin: 0 0 7px;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 1.35rem;
      line-height: .94;
      letter-spacing: -.06em;
      font-weight: 900;
      
      max-width: 420px;
    }

    .story p, .side p, .live p { color: #555; margin: 0; font-size: .95rem; }
    .story.large { min-height: 210px; }
    .story.medium { min-height: 150px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .ad {
      min-height: 120px;
      background: #e7e7e7;
      color: #555;
      display: grid;
      place-items: center;
      
      font-size: .85rem;
      letter-spacing: .08em;
    }

    .side { background: #fff8d7; }
    .live { border-top: 8px solid var(--red); }
    .small-note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Aftonbladet – timme för timme</h1>
    <p>© Joakim Ottosson · Koncept, design och utveckling</p>
  </header>

  <main>
    <section class="card">
      <div class="controls">
        <label>Intervall
          <select id="interval">
            <option value="30">Var 30:e minut</option>
            <option value="5">Var 5:e minut</option>
            <option value="10" selected>Var 10:e minut</option>
          </select>
        </label>

        <label>Tempo
          <input id="fps" type="number" value="10" min="1" max="30" />
        </label>

        <button id="captureBtn">Kör!</button>
        
        <button class="danger" id="resetBtn">Nollställ</button>
      </div>

      <div class="progress"><div id="bar"></div></div>
      <p class="small-note" id="status">Demo sajt</p>
      <div class="thumbs" id="thumbs"></div>
    </section>

    <section class="card">
      <div class="stage-head">
        <span id="mode"></span>
        <span id="clock">00:00</span>
      </div>
      <div class="viewport">
        
        <div class="site" id="site"></div>
      </div>
    </section>
  </main>

  <script>
    const site = document.getElementById('site');
    const bar = document.getElementById('bar');
    const statusEl = document.getElementById('status');
    const thumbs = document.getElementById('thumbs');
    const clock = document.getElementById('clock');
    const mode = document.getElementById('mode');

    let savedFrames = [];
    let captureTimer = null;
    let playTimer = null;

    const mainHeads = [
      'Just nu: Kraftig brand under natten',
      'Så påverkas din ekonomi av beskedet',
      'Kaos efter olycka på E4',
      'Experten: Därför svänger vädret',
      'Stjärnans dramatiska vändning',
      'Avslöjar: Dokumenten som ändrar allt',
      'Live: Följ utvecklingen minut för minut'
    ];

    const modules = ['Senaste nytt', 'Mest läst', 'Sportbladet', 'Nöje', 'Ledare', 'TV', 'Väder'];
    const imageWords = ["BILD"];

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function targetFrames() {
      return Math.round(24 * 60 / Number(document.getElementById('interval').value));
    }

    function updateProgress() {
      const target = targetFrames();
      const progress = savedFrames.length ? Math.min(100, savedFrames.length / target * 100) : 0;
      bar.style.width = progress + '%';
    }

    function renderPage(i) {
      const interval = Number(document.getElementById('interval').value);
      const minuteOfDay = i * interval;
      const hour = Math.floor(minuteOfDay / 60) % 24;
      const minute = minuteOfDay % 60;
      clock.textContent = pad(hour) + ':' + pad(minute);

      const main = mainHeads[Math.floor(i / 8) % mainHeads.length];
      const secondMain = mainHeads[(Math.floor(i / 10) + 3) % mainHeads.length];
      const side = modules[Math.floor(i / 6) % modules.length];
      const image = imageWords[Math.floor(i / 7) % imageWords.length];
      const secondImage = imageWords[(Math.floor(i / 8) + 2) % imageWords.length];

              <div class="hero-img small-img">${secondImage}</div>

            </article>

            <div class="grid2">
              ${story(i, 1, 'Politik', 'Nytt besked efter mötet')}
              ${story(i, 2, 'Ekonomi', 'Så ändras hushållens kostnader')}
            </div>

            ${story(i, 3, 'Sverige', 'Kommunen varnar efter händelsen', 'large')}
            <div class="ad">Annonsyta</div>

            <div class="grid2">
              ${story(i, 4, 'Världen', 'Presidenten pressas efter uttalandet')}
              ${story(i, 5, 'Kultur', 'Kritiken växer efter beslutet')}

          </section>

    <h3>Annat</h3>

    function story(i, seed, section, title, size = '') {
      const variants = ['uppdaterad', 'ny vinkel', 'bild ändrad', 'flyttad högre', 'senaste reaktionen', 'analys tillagd'];
      const variant = variants[Math.floor((i + seed * 3) / 4) % variants.length];
      return `
        <article class="story ${size}">
          
          <h3>${title}</h3>
          
        </article>
      `;
    }

    function makeThumb(index) {
      const el = document.createElement('div');
      el.className = 'thumb';
      el.title = 'Frame ' + (index + 1);
      el.innerHTML = '<div class="mini"><div class="mini-top"></div><div class="mini-red"></div><div class="mini-hero"></div><div class="mini-block"></div><div class="mini-block"></div><div class="mini-block"></div></div>';
      el.onclick = function () { showFrame(index); };
      thumbs.appendChild(el);
    }

    function setActive(index) {
      Array.from(thumbs.children).forEach(function (el, i) {
        el.classList.toggle('active', i === index);
      });
    }

    function showFrame(index) {
      stopCapture();
      stopPlay();
      if (!savedFrames[index]) return;
      site.innerHTML = savedFrames[index].html;
      clock.textContent = savedFrames[index].time;
      mode.textContent = 'Pausad på frame ' + (index + 1);
      statusEl.textContent = 'Auto-play stoppad. Visar vald frame.';
      setActive(index);
    }

    function startCapture() {
      resetAll();
      mode.textContent = 'Tid';
      statusEl.textContent = 'Senaste dygnet. Skärmdump var 30:e minut. Klicka på bilder nedan.';

      const target = targetFrames();
      let i = 0;

      captureTimer = setInterval(function () {
        renderPage(i);
        savedFrames.push({ html: site.innerHTML, time: clock.textContent });
        makeThumb(i);
        updateProgress();
        i++;

        if (i >= target) {
          clearInterval(captureTimer);
          mode.textContent = '';
          statusEl.textContent = 'Klar: ' + savedFrames.length + ' frames. Startar om automatiskt.';
          setTimeout(startCapture, 1200);
        }
      }, 120);
    }

    function stopPlay() {
      if (playTimer) clearInterval(playTimer);
    }

    function stopCapture() {
      if (captureTimer) clearInterval(captureTimer);
    }

    function stopPlay() {
      if (playTimer) clearInterval(playTimer);
    }

    function resetAll() {
      stopCapture();
      stopPlay();
      stopPlay();
      savedFrames = [];
      thumbs.innerHTML = '';
      updateProgress();
      renderPage(0);
      mode.textContent = '';
      statusEl.textContent = 'Demo sajt';
    }

    document.getElementById('captureBtn').addEventListener('click', startCapture);
    
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('interval').addEventListener('change', updateProgress);

    renderPage(0);
    updateProgress();
  </script>
